<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">SG90 2軸ジンバル 配線対応図</title>
<desc id="desc">PANはBCM GPIO12・物理32番、TILTはBCM GPIO13・物理33番。サーボは外部5Vで給電。外部電源GND、両サーボGND、Pi物理34番を共通接続する。</desc>
<style>text{font-family:"Yu Gothic",Meiryo,sans-serif;fill:#19344b;font-size:22px}.title{font-size:34px;font-weight:700}.head{font-size:26px;font-weight:700}.small{font-size:18px}.wire{fill:none;stroke-width:5;stroke-linecap:round}</style>
<rect width="1400" height="840" rx="24" fill="#f4f7fa"/>
<text x="50" y="60" class="title">SG90 2軸ジンバル ─ 配線対応図</text>
<text x="50" y="103">サーボは外部5Vで給電 ／ Piとは信号線とGNDを接続</text>
<rect x="40" y="130" width="1320" height="75" rx="14" fill="#19344b"/>
<text x="65" y="162" style="fill:white">接続先の対応図です。端子の位置・並び順は実物と異なります。</text>
<text x="65" y="191" class="small" style="fill:white">GPIOはBCM番号。「物理○番」と区別し、基板の向き・1番ピンを確認してください。</text>
<rect x="40" y="225" width="645" height="265" rx="18" fill="white" stroke="#d2dee7"/>
<rect x="715" y="225" width="645" height="265" rx="18" fill="white" stroke="#d2dee7"/>
<text x="65" y="269" class="head">PAN SG90 ／ 左右回転</text>
<text x="740" y="269" class="head">TILT SG90 ／ 上下回転</text>
<text x="65" y="309" class="small">サーボ側</text><text x="340" y="309" class="small">接続先</text>
<text x="740" y="309" class="small">サーボ側</text><text x="1015" y="309" class="small">接続先</text>
<text x="65" y="351">赤：電源＋</text><text x="340" y="351">外部電源 ＋5V</text>
<text x="65" y="402">茶／黒：GND</text><text x="340" y="402">共通GND（下図）</text>
<text x="65" y="453">橙／黄：信号</text><text x="340" y="445">Pi GPIO12</text><text x="340" y="472" class="small">物理32番</text>
<text x="740" y="351">赤：電源＋</text><text x="1015" y="351">外部電源 ＋5V</text>
<text x="740" y="402">茶／黒：GND</text><text x="1015" y="402">共通GND（下図）</text>
<text x="740" y="453">橙／黄：信号</text><text x="1015" y="445">Pi GPIO13</text><text x="1015" y="472" class="small">物理33番</text>
<path d="M245 344H318 M920 344H993" class="wire" stroke="#d35a46"/>
<path d="M245 395H318 M920 395H993" class="wire" stroke="#374957"/>
<path d="M245 446H318 M920 446H993" class="wire" stroke="#168e98"/>
<rect x="40" y="510" width="1320" height="180" rx="18" fill="white" stroke="#d2dee7"/>
<text x="65" y="550" class="head">共通GND：次の4点を電気的につなぐ</text>
<path d="M195 596V637H1200V596 M530 596V637 M860 596V637" class="wire" stroke="#374957"/>
<circle cx="530" cy="637" r="7" fill="#374957"/><circle cx="860" cy="637" r="7" fill="#374957"/>
<g text-anchor="middle"><text x="195" y="586">外部電源 −（GND）</text><text x="530" y="586">PAN GND</text><text x="860" y="586">TILT GND</text><text x="1200" y="586">Pi 物理34番（GND）</text></g>
<text x="65" y="674" class="small">PiはUSBから別給電。外部＋5Vはサーボ2個へ分岐し、Piの5V端子へは接続しません。</text>
<rect x="40" y="710" width="1320" height="105" rx="16" fill="#fff0df"/>
<text x="65" y="743" style="font-weight:700">通電前の確認</text>
<text x="65" y="773" class="small">• サーボの赤線をPiのGPIO・3.3V・5V（物理2/4番）へ接続しない。本構成は外部5V給電です。</text>
<text x="65" y="800" class="small">• 配線色は代表例。現物の仕様で極性を確認し、電源を切って配線。初回は狭い角度で動作確認。</text>
</svg>
