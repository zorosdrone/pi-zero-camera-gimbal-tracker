<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Pi Zero 2 W 推論時間の比較</title>
  <desc id="desc">対数軸で示す実測値。YOLOv5nu保存画像約17000ミリ秒、MobileNet-SSD平均約4850ミリ秒、FOMO推論約2から3ミリ秒。入力サイズと測定範囲が異なり、精度やライブ処理速度の直接比較ではない。KCFの比較可能な処理時間は未掲載。</desc>
  <rect width="1200" height="660" rx="24" fill="#f5f8fb"/>
  <g font-family="Segoe UI, Noto Sans JP, Meiryo, sans-serif" fill="#18334b">
    <text x="48" y="62" font-size="30" font-weight="700">Pi Zero 2 W：推論にかかる時間</text>
    <text x="48" y="98" font-size="18">短いほど高速。ただし、入力サイズ・モデル・測定範囲は異なります。</text>
    <rect x="36" y="124" width="1128" height="330" rx="16" fill="white"/>
    <g stroke="#d8e1e9" stroke-width="1">
      <path d="M330 162V390 M493 162V390 M656 162V390 M819 162V390 M982 162V390 M1095 162V390"/>
    </g>
    <g font-size="15" fill="#536878" text-anchor="middle">
      <text x="330" y="420">1 ms</text><text x="493" y="420">10 ms</text><text x="656" y="420">100 ms</text><text x="819" y="420">1秒</text><text x="982" y="420">10秒</text><text x="1095" y="420">50秒</text>
    </g>
    <text x="1095" y="148" font-size="14" text-anchor="end" fill="#536878">対数軸：目盛りごとに10倍</text>
    <text x="60" y="199" font-size="22" font-weight="700">YOLOv5nu</text>
    <text x="60" y="226" font-size="16" fill="#536878">640 × 640 / 保存画像</text>
    <path d="M330 211H1020" stroke="#d87b37" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1020" cy="211" r="10" fill="#bd6020"/><text x="1015" y="190" text-anchor="end" font-size="21" font-weight="700">約17秒（17,000 ms）</text>
    <text x="60" y="281" font-size="22" font-weight="700">MobileNet-SSD</text>
    <text x="60" y="308" font-size="16" fill="#536878">300 × 300 / 4スレッド</text>
    <path d="M330 293H931" stroke="#537eae" stroke-width="12" stroke-linecap="round"/>
    <circle cx="931" cy="293" r="10" fill="#3d6590"/><text x="926" y="272" text-anchor="end" font-size="21" font-weight="700">平均約4.85秒（4,850 ms）</text>
    <text x="60" y="363" font-size="22" font-weight="700">FOMO</text>
    <text x="60" y="390" font-size="16" fill="#536878">64 × 64 / 推論部分</text>
    <path d="M330 375H408" stroke="#21958d" stroke-width="12" stroke-linecap="round"/>
    <text x="434" y="382" font-size="21" font-weight="700">約2〜3 ms</text>
    <text x="60" y="485" font-size="17" font-weight="700">速度だけでは追尾方式を決められません</text>
    <text x="60" y="519" font-size="17">FOMO：ライブ処理は約14.70 fps。静止画評価は7/13で、背景誤検出が課題。</text>
    <text x="60" y="552" font-size="17">KCF：手動ROIから追跡。比較可能な処理時間は未掲載のため、この軸には載せません。</text>
    <text x="60" y="602" font-size="15" fill="#536878">出典：docs/benchmarks.md ／ カメラ取得・配信・サーボ応答を含む遅延の比較ではありません。</text>
    <text x="60" y="628" font-size="15" fill="#536878">線の長さは時間に比例しません（対数表示）。検出精度・汎用性能の順位を示す図ではありません。</text>
  </g>
</svg>
